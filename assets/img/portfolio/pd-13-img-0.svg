  <rect x="150" y="300" width="340" height="20" fill="#5b6675"/>
  <!-- earlier drop positions (trail) -->
  <circle cx="320" cy="118" r="26" fill="none" stroke="#8796a6" stroke-width="1.5" stroke-dasharray="4 4"/>
  <circle cx="320" cy="168" r="26" fill="none" stroke="#8796a6" stroke-width="1.5" stroke-dasharray="4 4"/>
